.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ciano);outline-offset:2px}

/* topo */
.topo{position:relative;overflow:hidden;color:var(--branco);background:var(--marinho);padding-block:22px 34px}
.topo .z{display:none}
.topo .wrap{position:relative}
.logo{height:26px;display:block}
.topo h1{font-weight:400;font-size:clamp(28px,7.4vw,38px);line-height:1.12;letter-spacing:-.015em;margin:26px 0 8px;text-wrap:balance}
.topo h1 span{color:var(--claro)}
.topo p{margin:0;color:rgba(255,255,255,.78);font-size:15px}

/* blocos */
section{padding-block:24px 4px}
.tit{font-size:22px;font-weight:500;letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
.sub{margin:0 0 14px;color:var(--cinza);font-size:15px}
.card{background:var(--branco);border-radius:24px;box-shadow:inset 0 0 0 1px var(--linha);padding:18px}

/* prioridade */
.pri{margin-top:-18px;position:relative;padding:20px 18px 8px}
.pri .rot{font-size:14px;color:var(--cinza);margin:0}.pri .sep{height:1px;background:var(--linha);margin:18px 0 14px}
.pri h2{font-size:22px;font-weight:600;margin:2px 0 14px;letter-spacing:-.01em}
.placar{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:14px}
.placar div{background:var(--fundo);border-radius:16px;padding:12px 10px;text-align:center}
.placar b{display:block;font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:var(--marinho)}
.pleg{font-size:12.5px;color:var(--cinza);margin:-4px 0 10px;text-align:center}
.placar small{display:block;font-size:12.5px;color:var(--cinza);margin-top:6px;line-height:1.25}
.placar .pl{display:block;height:22px;width:auto;max-width:72px;object-fit:contain;margin:0 auto 6px;background:#fff;border-radius:6px;padding:2px 5px}
.mx th .tl{display:block;height:18px;width:auto;max-width:60px;object-fit:contain;margin:0 auto 4px}
#qual{display:flex;align-items:center;gap:8px}#qual .ql{height:20px;width:auto;max-width:70px;object-fit:contain}
.placar div.top{background:var(--marinho);color:var(--branco)}
.placar div.top b{color:var(--branco)}.placar div.top small{color:rgba(255,255,255,.8)}
.mx{width:100%;border-collapse:collapse;font-size:14.5px}
.mx th{font-size:12px;font-weight:600;color:var(--cinza);text-align:center;padding:6px 3px;line-height:1.2;width:64px}
@media (min-width:480px){.mx th{width:88px;padding:6px 8px}.mx td{padding:12px 8px}.placar{gap:22px}}
.mx th:first-child{text-align:left;width:auto}
.mx td{border-top:1px solid var(--linha);padding:11px 3px;text-align:center;vertical-align:middle}
.mx td:first-child{text-align:left;padding-right:8px}
.mx td:first-child small{display:block;color:var(--cinza);font-size:12.5px;margin-top:2px}
.sv span{white-space:nowrap}.sv i{font-style:normal}
small.un{color:var(--cinza)}small.un span{display:inline-block;background:var(--fundo);color:var(--marinho);border-radius:8px;padding:3px 8px;margin:4px 4px 0 0;font-size:12px;line-height:1.25}
@media (max-width:479px){.mx th{width:58px}}
.mx td:first-child{word-break:normal;overflow-wrap:anywhere}
.sim,.nao{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%}
.sim{background:var(--okfundo);color:var(--ok)}
.nao{color:var(--nao)}
.sim svg,.nao svg{width:16px;height:16px}

/* opções */
.ops{display:grid;gap:18px}
.op{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--branco);border-radius:20px;box-shadow:inset 0 0 0 1.5px var(--linha);padding:16px 18px;min-height:76px;transition:transform .15s,box-shadow .15s}
.op .n{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--fundo);color:var(--azul)}
.op .t{flex:1;min-width:0}
.op .opl{flex:none;height:30px;width:auto;max-width:96px;object-fit:contain;background:#fff;border-radius:8px;padding:3px 6px}
.op b{display:block;font-size:18px;font-weight:600}
.op span{display:block;font-size:14px;color:var(--cinza)}
.op i{font-style:normal;font-size:26px;color:var(--azul)}
.op[aria-pressed="true"]{background:var(--marinho);color:var(--branco);box-shadow:none}.op[aria-pressed="true"] .opl{outline:2px solid var(--ciano)}
.op[aria-pressed="true"] span{color:rgba(255,255,255,.78)}
.op[aria-pressed="true"] .n{background:var(--ciano);color:var(--marinho)}
.op[aria-pressed="true"] i{color:var(--ciano);transform:rotate(90deg)}
.op:active{transform:scale(.99)}

/* busca e filtros */
.busca{position:relative;margin:16px 0 10px}
.busca input{width:100%;height:58px;border-radius:999px;border:0;box-shadow:inset 0 0 0 1.5px var(--linha);background:var(--branco);font-size:16px;padding:0 50px 0 50px}
.busca input:focus{box-shadow:inset 0 0 0 2px var(--azul);outline:none}
.busca svg{position:absolute;left:18px;top:19px;width:20px;height:20px;color:var(--cinza)}
.busca button{position:absolute;right:8px;top:8px;width:42px;height:42px;border-radius:50%;border:0;background:var(--fundo);font-size:20px}
.fil{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.fil button{min-height:52px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;white-space:nowrap;border-radius:16px;border:0;background:var(--branco);box-shadow:inset 0 0 0 1.5px var(--linha);font-size:12.5px;letter-spacing:-.01em;font-weight:500}
.fil button b{font-size:12.5px;font-weight:600;color:var(--azul);margin-top:2px;font-variant-numeric:tabular-nums}
.fil button[aria-pressed="true"]{background:var(--azul);color:var(--branco);box-shadow:none}
.fil button[aria-pressed="true"] b{color:var(--branco)}
.fil.fil4{grid-template-columns:repeat(4,1fr);gap:5px}.fil.fil4 button{font-size:11.5px;min-height:46px;padding:4px 2px;letter-spacing:-.02em}
.lbl{font-size:13px;color:var(--cinza);margin:10px 0 6px}#qual{font-size:15px;font-weight:600;color:var(--marinho);margin:16px 0 0}

/* lista */
.grupos{display:grid;gap:10px;margin-top:12px}
details{background:var(--branco);border-radius:20px;box-shadow:inset 0 0 0 1px var(--linha)}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px 18px;min-height:60px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary b{flex:1;font-size:17px;font-weight:600}
summary em{font-style:normal;font-size:14px;color:var(--cinza);font-variant-numeric:tabular-nums}
summary i{font-style:normal;color:var(--azul);font-size:22px;transition:transform .15s}
details[open] summary i{transform:rotate(90deg)}
details.pr{box-shadow:inset 0 0 0 2px var(--azul)}
details.pr summary b:after{content:"Sua região";margin-left:8px;font-size:12px;font-weight:600;color:var(--azul);background:#E6EEFB;border-radius:999px;padding:3px 9px;vertical-align:2px}
ul.it{list-style:none;margin:0;padding:0 18px 10px}
ul.it li{border-top:1px solid var(--linha);padding:12px 0;display:flex;gap:12px;align-items:flex-start}
ul.it li .tx{flex:1;min-width:0}
ul.it li b{display:block;font-weight:500;font-size:15.5px;line-height:1.3}
ul.it li small{display:block;color:var(--cinza);font-size:13px;margin-top:3px}
.cob{display:flex;gap:4px;flex:none;padding-top:2px}
.cob span{font-size:11px;font-weight:600;border-radius:8px;padding:4px 6px;line-height:1;background:var(--fundo);color:var(--nao);text-decoration:line-through}
.cob span.s{background:var(--okfundo);color:var(--ok);text-decoration:none}
.mais{display:block;width:100%;height:50px;border:0;border-radius:999px;background:var(--fundo);font-size:15px;font-weight:600;color:var(--azul);margin-top:8px}
.vazio{padding:18px;color:var(--cinza);text-align:center}
.leg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--cinza);margin-top:10px}

/* rodapé */
.nota{font-size:12.5px;color:var(--cinza);padding-block:22px 120px;margin:0}
.barra{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(242,246,252,.94);backdrop-filter:blur(8px);border-top:1px solid var(--linha)}
.barra a{display:flex;align-items:center;justify-content:center;gap:10px;max-width:608px;margin:0 auto;height:56px;border-radius:999px;background:var(--marinho);color:var(--branco);font-weight:600;font-size:16px;text-decoration:none}
.barra svg{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.op .pr{display:block;font-style:normal;font-weight:600;font-size:15px;margin-top:4px;color:var(--azul)}
.op .pr small{font-weight:400;font-size:12px;opacity:.75}
.op[aria-pressed="true"] .pr{color:#5BC7F8}

/* Estética sóbria: menos cara de IA (Lucas, 10/10 11:28) */
.card,details,.op,.placar div,.fil button{border-radius:10px!important}
.busca input{border-radius:10px!important}
.busca button{border-radius:8px!important;background:none!important}
.mais,.barra a{border-radius:10px!important}
.mais{background:none!important;box-shadow:inset 0 0 0 1px var(--linha)}
.op .n{display:none!important}
.op .opl{border-radius:4px!important}
details.pr summary b:after{background:none!important;padding:0!important;border-radius:0!important;color:var(--cinza,#5A6B88)!important;font-weight:500!important}
.cob span{border-radius:4px!important}
.placar div{background:none!important;box-shadow:inset 0 0 0 1px var(--linha)}

.placar div.top,.placar .top{background:none!important;box-shadow:inset 0 0 0 2px var(--marinho)!important;color:var(--marinho)!important}
.placar .top b,.placar .top small{color:var(--marinho)!important}
.sim{background:none!important}
.placar div.top small{color:var(--cinza,#5A6B88)!important}
.un span{background:none!important;padding:0!important;margin:2px 8px 0 4px!important;border-radius:0!important}
.pleg{font-size:15px!important;color:var(--marinho)!important;text-align:left!important;margin:2px 0 14px!important;white-space:nowrap}

/* VERSÃO B (time de marca, 10/10): fundo branco, bloco marinho como assinatura, tipografia grande à esquerda,
   listas com linha fina no lugar de caixas, marcador marinho de 3px no escolhido, números tabulares. */
:root{--fundo:#FFFFFF;--linha:#E4EAF3}
body{background:#fff;font-feature-settings:"tnum" 1,"cv11" 1}
.topo{padding-block:22px 30px;margin:0 16px;border-radius:16px;max-width:608px}
@media (min-width:672px){.topo{margin:0 auto}}
.topo h1{font-size:clamp(32px,8.6vw,44px)!important;font-weight:500;letter-spacing:-.035em;line-height:1.05}
.tit{font-size:27px!important;letter-spacing:-.025em!important;line-height:1.1}
.card{box-shadow:none!important;border-radius:0!important;padding:0!important;background:none!important}
.pri{margin-top:6px!important;padding:0!important}
.pri h2{font-size:24px!important;letter-spacing:-.02em}
.pri .sep{background:var(--linha)}
.placar{gap:0!important;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.placar div,.placar div.top,.placar .top{box-shadow:none!important;border-radius:0!important;padding:12px 6px!important;position:relative}
.placar div+div{border-left:1px solid var(--linha)}
.placar div.top{background:#F4F7FD!important}
.placar div.top:before{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--marinho)}
.placar b{font-size:34px!important;font-weight:500!important;letter-spacing:-.03em}
.ops{gap:0!important;border-top:1px solid var(--linha)}
.op{border-radius:0!important;box-shadow:none!important;border-bottom:1px solid var(--linha)!important;padding:16px 8px 16px 14px!important;position:relative}
.op[aria-pressed="true"]{background:#F4F7FD!important;color:var(--tinta)!important}
.op[aria-pressed="true"]:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--marinho)}
.op[aria-pressed="true"] span{color:var(--cinza)!important}
.op[aria-pressed="true"] .pr{color:var(--azul)!important}
.op[aria-pressed="true"] i{color:var(--marinho)!important}
.op[aria-pressed="true"] .opl{outline:0!important}
.busca input{border-radius:12px!important;background:#F4F7FD!important;box-shadow:none!important}
.busca input:focus{box-shadow:inset 0 0 0 2px var(--marinho)!important}
.fil button{box-shadow:inset 0 0 0 1px var(--linha)!important}

.grupos{gap:0!important;border-top:1px solid var(--linha)}
details,details.pr{border-radius:0!important;box-shadow:none!important;border-bottom:1px solid var(--linha);background:none!important;position:relative}
details.pr:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--marinho)}
summary{padding:16px 6px 16px 14px!important}
ul.it{padding:0 6px 10px 14px!important}
.mais{box-shadow:none!important;border-top:1px solid var(--linha)!important;border-radius:0!important;text-align:left;padding-left:14px;color:var(--marinho)}
.barra{background:rgba(255,255,255,.96)}
.barra a{border-radius:12px!important}
small.un span{background:#EEF3FB!important}
.pri{margin-top:20px!important}

/* prévia curta no topo e busca logo em seguida (Lucas, 10/10 12:08) */
.ver{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--linha);padding:12px 2px;font-size:15px;font-weight:600;color:var(--azul);text-align:left;margin-top:2px}
.ver:after{content:"›";font-size:20px;transition:transform .15s}.ver[aria-expanded="true"]:after{transform:rotate(90deg)}
.pri h2{margin-bottom:10px!important}.pleg{margin-bottom:6px!important}.pri .sep{margin:8px 0 12px!important}
section{padding-top:20px}
.topo{margin:0!important;border-radius:0!important;max-width:none!important}
.pt{font-style:normal;color:#5BC7F8!important}

/* planos lado a lado, compactos, para a busca aparecer logo (Lucas, 10/10 12:08) */
.ops{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))!important;gap:8px!important}
.op{flex-direction:column!important;align-items:flex-start!important;gap:6px!important;padding:10px 10px!important;min-height:0!important}
.op .opl{height:22px!important;max-width:84px!important;padding:0!important}
.op b{font-size:15px!important;line-height:1.2}
.op span{font-size:12px!important;line-height:1.3}
.op .pr{font-size:13px!important;margin-top:2px!important}
.op i{display:none!important}
.sub{margin-bottom:10px!important}
.ops{gap:0!important;border-top:0!important}
.op{border:1px solid var(--linha)!important;border-radius:0!important}
.op+.op{border-left:0!important}
.op[aria-pressed="true"]:before{left:0;right:0;top:-1px;bottom:auto;width:auto;height:3px}

/* economia por plano */
.op .ec{display:block;font-style:normal;font-weight:600;font-size:13px;line-height:1.35;color:#0F7B4F;margin-top:6px;padding-top:6px;border-top:1px solid var(--linha);font-variant-numeric:tabular-nums}
.op .ec small{font-weight:400;font-size:11.5px;color:#0F7B4F;opacity:.85}
.op .ec small:first-child{display:block;font-size:11.5px;color:var(--cinza);opacity:1;font-weight:500}
.op .ec.mais{color:var(--cinza);font-weight:500;font-size:12px}
.op[aria-pressed="true"] .ec{color:#0F7B4F}
.hoje{font-size:14px;color:var(--cinza);margin:-4px 0 12px}.hoje b{color:var(--marinho)}
.op .ec span{display:block;white-space:nowrap}.op .ec small{display:block!important;font-size:11px!important;color:var(--cinza)!important;opacity:1!important;font-weight:500!important;margin-top:4px}.op .ec small:first-child{margin-top:0}
.op .ec span{color:#0F7B4F!important;font-size:14px!important;font-weight:600!important}

/* uma seção só para hospitais e laboratórios (Lucas, 10/10 12:22) */
.placar.pl2 .pn{margin:0 0 8px!important;font-size:12.5px}
.placar.pl2 .n2{display:block;margin-top:6px}
.placar.pl2 .n2 b{display:inline!important;font-size:26px!important}
.placar.pl2 .n2 small{display:block!important;margin-top:0!important;font-size:12px}

/* sem a prévia da região no topo: a busca já abre o que atende na região (Lucas, 10/10 12:24) */

.cr{border-bottom:1px solid var(--linha)}
.crb{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:14px 2px;text-align:left;color:var(--marinho)}

.crb b{flex:1;font-size:15.5px;font-weight:600}
.crb em{font-style:normal;font-size:14px;color:var(--cinza);font-variant-numeric:tabular-nums}
.crd{padding:0 0 12px}
.bq{font-size:15px;font-weight:600;color:var(--marinho);margin:22px 0 0}

.op[aria-pressed="true"] .ec.mais{color:var(--cinza)!important}

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="text" inputmode="search" enterkeyhint="search" placeholder="Ex.: Copa D'Or ou Botafogo" autocomplete="off" aria-label="Buscar na rede">
      <button id="limpa" hidden aria-label="Limpar busca">×</button>
    </div>
    <div class="fil" id="tipos"></div>
    <p class="lbl">Precisa de</p>
    <div class="fil fil4" id="servs"></div>
    <p class="lbl" id="qual"></p>
    <div class="grupos" id="lista"></div>
  </section>

  <p class="nota" id="nota"></p>
</main>



<script type="text/plain" id="zr-app">
(function(){
const D = window.ZD;
const P = D.planos, N = P.length, PR = D.prioridade || null;
const TIPOS = [["h","Hospitais"],["l","Laboratórios"],["c","Centros médicos"]];
const NEUTRA = ["Centro","Zona Sul","Zona Norte","Zona Oeste","Niterói","São Gonçalo","Duque de Caxias","Nova Iguaçu","São João de Meriti","Belford Roxo","Nilópolis","Mesquita"];
const VIZINHAS = {"Zona Oeste":["Zona Oeste","Zona Sul","Centro","Zona Norte","Nova Iguaçu","Duque de Caxias","Niterói"],
  "Zona Sul":["Zona Sul","Centro","Zona Oeste","Zona Norte","Niterói"], "Centro":["Centro","Zona Sul","Zona Norte","Zona Oeste","Niterói"],
  "Zona Norte":["Zona Norte","Centro","Zona Sul","Zona Oeste","Duque de Caxias","São João de Meriti","Niterói"], "Niterói":["Niterói","São Gonçalo","Centro","Zona Sul","Zona Norte","Zona Oeste"]};
const ORDEM = (D.prioridade && VIZINHAS[D.prioridade.regiao]) ? VIZINHAS[D.prioridade.regiao].concat(NEUTRA.filter(r => !VIZINHAS[D.prioridade.regiao].includes(r))) : NEUTRA;
const SERVS = ["Pronto-socorro","PS infantil","Maternidade","Internação"];
const ICON_SIM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const ICON_NAO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 12h10"/></svg>';
const $ = s => document.querySelector(s);
const sem = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plogo = (p, cls) => p.logo ? `<img class="${cls}" src="${p.logo}" alt="${esc(p.op||"")}">` : "";
const pnome = p => { if (!p.logo || !p.op) return p.nome; const ops = sem(p.op).split(/[^a-z0-9]+/).filter(x => x.length > 2); const n = p.nome.split(" ").filter((w,i) => !(i === 0 && ops.includes(sem(w)))).join(" "); return n || p.nome; };
// item: [tipo, nome, uf, cidade, região, [serviços por opção | null]]
const items = D.items.map(i => ({t:i[0], nome:i[1], cid:i[3], reg:i[4], cob:i[5], k:sem(i[1]+" "+i[3]+" "+i[4])}));
const grupo = i => i.cid === "Rio de Janeiro" && i.reg ? i.reg : i.cid;
const ehPriT = (i,t) => PR && i.t === t && (!PR.cidade || i.cid === PR.cidade) && (PR.termos.some(x => sem(i.nome).includes(sem(x))) || (PR.nomes||[]).some(n => sem(i.nome).includes(sem(n))));
const ehPri = i => ehPriT(i, st.tipo);
const tem = (i,k) => i.cob[k] !== null;

let st = {op:0, tipo:"h", serv:null, q:""};
try{ const s = JSON.parse(localStorage.getItem("zr-"+D.id)||"{}"); if(s.op < N) st.op = s.op; }catch(e){}

const dt = D.data ? D.data.split("-").reverse().join("/") : "";
$("#meta").textContent = (D.nome ? "Preparado para " + D.nome + " · " : "") + "Atualizada em " + dt;
if (N === 1) $("#h1").innerHTML = "Onde você é atendido <span>no " + esc(P[0].nome) + '<i class="pt">.</i></span>';
$("#nota").textContent = "Comparativo feito pela Ziba com a rede informada pelas operadoras na data da cotação.";

// 1. prioridade do cliente
function bloco(t, rotulo, plural){
  const lista = agrupa(items.filter(i => ehPriT(i,t)));
  if (!lista.length) return {conta: P.map(()=>0), lista, det: ""};
  const conta = P.map((p,k) => lista.filter(g => temG(g,k)).length);
  const max = Math.max(...conta);
  const linhas = lista.sort((a,b) => P.filter((p,k)=>temG(b,k)).length - P.filter((p,k)=>temG(a,k)).length || a.nome.localeCompare(b.nome))
    .map((g,j) => `<tr${j>=LIM?' hidden':''}><td>${esc(g.nome)}${unTxt(g)}${servHtml(servG(g))}</td>${P.map((p,k)=>`<td>${temG(g,k)?`<span class="sim" aria-label="Atende">${ICON_SIM}</span>`:`<span class="nao" aria-label="Não atende">${ICON_NAO}</span>`}</td>`).join("")}</tr>`).join("");
  return {conta, lista, det: `<button class="ver" data-ver aria-expanded="false">Ver ${plural} um a um</button><div class="det" hidden><table class="mx"><tr><th>${lista.length} ${plural}</th>${P.map(p=>`<th>${plogo(p,"tl")}${esc(pnome(p))}</th>`).join("")}</tr>${linhas}</table>${lista.length>LIM?`<button class="mais" data-mais>Ver mais ${plural}</button>`:""}</div>`};
}
// cadeias: "Bronstein Medicina Diag. - Un. Barra Da Tijuca - Plaza" vira um nome só com as unidades embaixo
function cadeia(n){
  const m = n.match(/^(.*?)\s+-\s+(?:(?:Grupo|Rede|Antigo)[^-]*-\s+)*(?:Un\.|Unid\.|Unidade)\s+(.+)$/i);
  return m ? {c: curto(m[1]), u: m[2].trim().replace(/\b(Da|De|Do|Das|Dos|E)\b/g, x => x.toLowerCase())} : {c: curto(n), u: null};
}
function agrupa(arr){
  const M = new Map();
  arr.forEach(i => { const {c,u} = cadeia(i.nome); const k = sem(c);
    const g = M.get(k) || M.set(k,{nome:c, un:[], itens:[], cid:i.cid, reg:i.reg}).get(k);
    g.itens.push(i); if (u && !g.un.includes(u)) g.un.push(u); });
  return [...M.values()];
}
function temG(g,k){ return g.itens.some(i => tem(i,k)); }
function servG(g, k){ const s = new Set(); g.itens.forEach(i => (k==null ? i.cob : [i.cob[k]]).forEach(c => c && c.forEach(x => s.add(x)))); return [...s]; }
function servHtml(a){ return a.length ? `<small class="sv">${a.map(x=>`<span>${esc(x)}</span>`).join('<i> · </i>')}</small>` : ""; }
function unTxt(g){ if (!g.un.length) return ""; const u = g.un.slice().sort((a,b)=>a.localeCompare(b)); return `<small class="un">${u.length>1?`${u.length} unidades`:"Unidade"}${u.map(x=>`<span>${esc(x)}</span>`).join("")}</small>`; }
const LIM = 5;
function prioridade(){
  if (!PR){ $("#pri").hidden = true; return; }
  const onde = PR.curto.replace(/^Na\s/i,"na ").replace(/^No\s/i,"no ");
  const H = bloco("h", "", "hospitais"), L = bloco("l", "", "laboratórios");
  const max = Math.max(...H.conta);
  const tit = PR.curto.replace(/^na\s/i,"Na ").replace(/^no\s/i,"No ");
  $("#pri").innerHTML = `<p class="rot">Sua região</p><h2>${esc(tit)}<i class="pt">.</i></h2>
  <div class="placar pl2">${P.map((p,k)=>`<div class="${H.conta[k]===max&&max>0?"top":""}">${plogo(p,"pl")}<small class="pn">${esc(pnome(p))}</small><span class="n2"><b>${H.conta[k]}</b><small>hospitais</small></span><span class="n2"><b>${L.conta[k]}</b><small>laboratórios</small></span></div>`).join("")}</div>
  <p class="pleg">Quantos cada plano atende na sua região</p>${H.det}${L.det}`;
  $("#pri").querySelectorAll("[data-ver]").forEach(b => b.onclick = () => { const d = b.nextElementSibling, ab = d.hidden; d.hidden = !ab; b.setAttribute("aria-expanded", ab); b.textContent = (ab ? "Fechar a lista" : b.dataset.t); });
  $("#pri").querySelectorAll("[data-ver]").forEach(b => b.dataset.t = b.textContent);
  $("#pri").querySelectorAll("[data-mais]").forEach(b => b.onclick = () => { b.previousElementSibling.querySelectorAll("tr[hidden]").forEach(tr => tr.hidden = false); b.remove(); });
}
function curto(n){ return n.replace(/\s+-\s+(Grupo|Rede|Antigo)\b.*$/i,"").replace(/^Hosp\.\s/,"Hospital "); }
function servTxt(i){ const s = new Set(); i.cob.forEach(c => c && c.forEach(x => s.add(x))); return [...s].join(" · ") || ""; }

// economia contra o plano atual (Lucas, 10/10 12:17): só aparece quando o cliente já tem plano
const ATUAL = D.atual ? +String(D.atual).replace(/\./g,"").replace(",",".") : 0;
const reais = v => "R$ " + v.toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2});
const reaisAno = v => "R$ " + Math.round(v).toLocaleString("pt-BR");
function eco(p){
  if (!ATUAL || !p.preco) return "";
  const d = ATUAL - +p.preco.replace(/\./g,"").replace(",",".");
  if (d <= 0) return `<em class="ec mais">${reais(-d)} a mais por mês</em>`;
  return `<em class="ec"><small>Economia por mês</small><span>${reais(d)}</span><small>Economia por ano</small><span>${reaisAno(d*12)}</span></em>`;
}
// comparativo breve da região do cliente, recolhido (Lucas, 10/10 22:21)
const LUGAR = PR ? PR.curto.replace(/^n[ao]s?\s+/i, "") : "";
function compRegiao(){
  if (!PR){ $("#creg").hidden = true; return; }
  const tabs = [["h","hospitais"],["l","laboratórios"]].map(([t,pl]) => { const B = bloco(t, "", pl);
    return {pl, n: B.lista.length, tab: B.det.replace(/^<button class="ver"[^>]*>[^<]*<\/button><div class="det" hidden>/, "").replace(/<\/div>$/, "")}; }).filter(x => x.n);
  if (!tabs.length){ $("#creg").hidden = true; return; }
  $("#creg").innerHTML = `<div class="cr"><button class="crb" aria-expanded="false"><span class="cx">+</span><b>Hospitais e laboratórios perto de mim</b></button><div class="crd" hidden>
    ${tabs.map((x,k) => `<div class="ctab" data-k="${k}"${k?" hidden":""}>${x.tab}</div>`).join("")}
    ${tabs.length > 1 ? `<button class="ctro"><span class="cx">+</span><b>Ver laboratórios</b></button>` : ""}</div></div>`;
  const crb = $("#creg .crb"); crb.onclick = () => { const d = crb.nextElementSibling, ab = d.hidden; d.hidden = !ab; crb.setAttribute("aria-expanded", ab); crb.querySelector(".cx").textContent = ab ? "−" : "+"; };
  const tro = $("#creg .ctro"); if (tro) tro.onclick = () => { const ts = $("#creg").querySelectorAll(".ctab"), lab = ts[0].hidden === false;
    ts[0].hidden = lab; ts[1].hidden = !lab; tro.querySelector("b").textContent = lab ? "Ver hospitais" : "Ver laboratórios"; };
  $("#creg").querySelectorAll("[data-mais]").forEach(b => b.onclick = () => { b.previousElementSibling.querySelectorAll("tr[hidden]").forEach(tr => tr.hidden = false); b.remove(); });
}
// 2. botões das opções
function opcoes(){
  $("#ops").innerHTML = P.map((p,k)=>{
    const h = agrupa(items.filter(i=>i.t==="h"&&tem(i,k))).length, l = agrupa(items.filter(i=>i.t==="l"&&tem(i,k))).length;
    return `<button class="op" data-k="${k}" aria-pressed="${k===st.op}">${p.logo?`<img class="opl" src="${p.logo}" alt="${esc(p.op||"")}">`:""}<span class="t"><b>${esc(pnome(p))}</b><span>${h} hospitais<br>${l} laboratórios</span>${p.preco?`<em class="pr">R$ ${esc(p.preco)}<small> /mês</small></em>` + eco(p):""}</span><i>›</i></button>`;
  }).join("");
  $("#ops").querySelectorAll(".op").forEach(b => b.onclick = () => {
    st.op = +b.dataset.k; try{localStorage.setItem("zr-"+D.id, JSON.stringify({op:st.op}))}catch(e){}
    opcoes(); filtros(); lista();
    $(".busca").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth", block:"start"});
  });
}

// 3. filtros
function filtros(){
  const q = sem(st.q.trim()); const base = items.filter(i => tem(i,st.op) && (!q || i.k.includes(q)));
  $("#tipos").innerHTML = TIPOS.map(([t,n]) => { const c = agrupa(base.filter(i=>i.t===t)).length; return c ? `<button data-t="${t}" aria-pressed="${st.tipo===t}">${n}<b>${c}</b></button>` : ""; }).join("");
  $("#tipos").querySelectorAll("button").forEach(b => b.onclick = () => { st.tipo = b.dataset.t; if(st.tipo!=="h") st.serv=null; filtros(); lista(); });
  const temServ = st.tipo === "h";
  $("#servs").hidden = !temServ; $("#servs").previousElementSibling.hidden = !temServ;
  $("#servs").innerHTML = SERVS.map(s => `<button data-s="${s}" aria-pressed="${st.serv===s}">${s}</button>`).join("");
  $("#servs").querySelectorAll("button").forEach(b => b.onclick = () => { st.serv = st.serv===b.dataset.s ? null : b.dataset.s; filtros(); lista(); });
}

// 4. lista por região, com a prioridade primeiro
function lista(){
  const q = sem(st.q.trim());
  const servOk = i => !st.serv || (i.cob[st.op]||[]).includes(st.serv);
  let L = items.filter(i => i.t===st.tipo && tem(i,st.op) && servOk(i) && (!q || i.k.includes(q)));
  $("#qual").innerHTML = plogo(P[st.op],"ql") + "Rede do " + esc(pnome(P[st.op]));
  $("#bq").textContent = "Procure um hospital, laboratório ou bairro na rede do " + pnome(P[st.op]) + ".";
  if (!L.length){ $("#lista").innerHTML = `<div class="card vazio">${q ? "Não achamos “"+esc(st.q)+"” na rede do "+esc(pnome(P[st.op]))+"." : "Nada com esse filtro neste plano. Tente outro."}</div>`; return; }
  const G = new Map();
  if (PR) L.filter(ehPri).forEach(i => (G.get("★")||G.set("★",[]).get("★")).push(i));
  L.filter(i => !(PR && ehPri(i))).forEach(i => { const g = grupo(i)||"Outros"; (G.get(g)||G.set(g,[]).get(g)).push(i); });
  const pos = g => g==="★" ? -2 : (PR && g===PR.regiao) ? -1 : (ORDEM.indexOf(g) < 0 ? 99 : ORDEM.indexOf(g));
  const ordem = [...G.keys()].sort((a,b) => pos(a) - pos(b) || G.get(b).length - G.get(a).length || a.localeCompare(b));
  let abertos = q ? 99 : 1;
  $("#lista").innerHTML = ordem.map((g,n) => {
    const arr = agrupa(G.get(g)).sort((a,b)=>a.nome.localeCompare(b.nome));
    const nome = g==="★" ? LUGAR : g;
    const lim = 12;
    const onde = gr => { const s = new Set(gr.itens.map(i => i.cid==="Rio de Janeiro"?(i.reg?i.reg+", Rio":"Rio"):i.cid)); return [...s].join(" · "); };
    const li = arr.map((gr,j)=>`<li${j>=lim?' hidden':''}><span class="tx"><b>${esc(gr.nome)}</b>${unTxt(gr)}${servHtml(servG(gr,st.op))}${g==="★"||q?`<small>${esc(onde(gr))}</small>`:""}</span></li>`).join("");
    return `<details class="${g==="★"?"pr":""}" ${n<abertos?"open":""}><summary><b>${esc(nome)}</b><em>${arr.length}</em><i>›</i></summary><ul class="it">${li}</ul>${arr.length>lim?`<div style="padding:0 18px 16px"><button class="mais">Ver todos os ${arr.length}</button></div>`:""}</details>`;
  }).join("");
  $("#lista").querySelectorAll(".mais").forEach(b => b.onclick = () => { b.closest("details").querySelectorAll("li[hidden]").forEach(li=>li.hidden=false); b.parentNode.remove(); });
}

$("#q").addEventListener("input", e => { st.q = e.target.value; $("#limpa").hidden = !st.q; filtros(); lista(); });
$("#limpa").onclick = () => { $("#q").value = ""; st.q = ""; $("#limpa").hidden = true; filtros(); lista(); $("#q").focus(); };

if (ATUAL){ const q = D.quem || "você paga"; $("#hoje").hidden = false; $("#hoje").innerHTML = `<small>Seu plano hoje</small><b>${reais(ATUAL)}<span> por mês</span></b><p>Em cada opção abaixo, veja quanto ${/empresa/.test(q) ? "a empresa economiza" : "você economiza"}.</p>`; }
prioridade(); compRegiao(); opcoes(); filtros(); lista();
})();

// legenda do placar sempre numa linha: reduz a letra só o necessário (mín. 12px)
function umaLinha(){ document.querySelectorAll('.pleg').forEach(e => { let f = 15; e.style.setProperty('font-size', f+'px', 'important');
  while (e.scrollWidth > e.clientWidth && f > 12){ f -= .5; e.style.setProperty('font-size', f+'px', 'important'); } }); }
new MutationObserver(umaLinha).observe(document.body, {childList:true, subtree:true});
addEventListener('resize', umaLinha); addEventListener('load', umaLinha);
</script><script>
(function(){
var AJAX="/wp-admin/admin-ajax.php", RAW="https://raw.githubusercontent.com/ZibaSeguros/ziba-rede/main/";
var m=location.pathname.match(/(\d{3,})\/?$/), q=new URLSearchParams(location.search).get("e"), n=((q||"")||(m?m[1]:"")).replace(/\D/g,"");
function aviso(t,s){document.body.insertAdjacentHTML("afterbegin",'<div style="max-width:640px;margin:0 auto;padding:64px 16px;font:400 17px/1.5 Switzer,Inter,system-ui,sans-serif;color:#08214F"><b style="display:block;font-size:24px;font-weight:500;color:#001E62;margin-bottom:6px">'+t+'</b>'+s+'</div>');document.querySelectorAll("body > :not(div):not(script)").forEach(function(e){e.style.display="none"});}
function pega(u){return fetch(u,{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json();});}
function v1(P){var N=P.planos.length;return {v:2,id:P.id,data:P.data,planos:P.planos.map(function(p,k){return {id:"o"+(k+1),nome:p.nome,op:"",sub:p.sub};}),
  items:P.items.map(function(i){var c=[];for(var k=0;k<N;k++)c.push(i[6+k]?(i[0]=="h"?i[5]:(i[0]=="l"?[]:["Centro médico"])):null);return [i[0],i[1],i[2],i[3],i[4],c];})};}
if(!n){aviso("Rede credenciada","Abra esta página pelo link da sua cotação.");return;}
pega(AJAX+"?action=ziba_rede_dados&e="+n).then(function(j){
  if(!j||!j.produto)throw 0;
  return pega(RAW+"v2/e"+n+".json").catch(function(){return null;}).then(function(D2){
    var D=(D2&&D2.v==2)?D2:(j.produto.v==2?j.produto:v1(j.produto));
    if(j.c)D.nome=j.c;
    D.planos.forEach(function(p){if(p.logo&&!/^(data:|https?:)/.test(p.logo))p.logo=RAW+"logos/"+p.logo+".png";});
    window.ZD=D;
    var s=document.createElement("script");s.textContent=document.getElementById("zr-app").textContent;document.body.appendChild(s);
    /* aviso para a Ziba de que o cliente abriu a rede */
    try{fetch(AJAX+"?action=ziba_rede_aviso&e="+n,{cache:"no-cache"});}catch(e){}
  });
}).catch(function(){aviso("Rede credenciada","Não encontramos a rede desta cotação. Fale com o corretor responsável pela sua cotação.");});
})();
</script></body></html>
